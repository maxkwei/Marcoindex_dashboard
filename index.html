<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全球總經利率與外匯油價儀表板 (2000-2026)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-red: #f87171;
      --accent-yellow: #fbbf24;
      --accent-green: #34d399;
      --accent-purple: #c084fc;
      --accent-orange: #fb923c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container { max-width: 1400px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    h1 { margin: 0; color: var(--accent-blue); font-size: 1.5rem; }
    .update-time { color: var(--text-sub); font-size: 0.85rem; }

    .chart-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 20px;
      margin-bottom: 20px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .chart-title { font-size: 1.1rem; font-weight: 600; color: var(--text-main); margin: 0; }

    /* 指標強迫單列 (Single Row) 排版 */
    .embedded-metrics-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 550px;
    }

    .embedded-metrics-row-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 380px;
    }

    .metric-badge {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      text-align: center;
    }

    .metric-label { font-size: 0.75rem; color: var(--text-sub); display: block; margin-bottom: 2px; }
    .metric-value { font-size: 1.1rem; font-weight: bold; }

    .canvas-wrapper { position: relative; height: 320px; width: 100%; }

    .news-section { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
    .news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
    .news-item { background: rgba(15, 23, 42, 0.4); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
    .news-item a { color: var(--text-main); text-decoration: none; font-size: 0.9rem; font-weight: 500; display: block; margin-bottom: 6px; }
    .news-item a:hover { color: var(--accent-blue); }
    .news-meta { font-size: 0.75rem; color: var(--text-sub); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>全球總體經濟、利率與外匯油價儀表板</h1>
      <div class="update-time" id="updated-at">資料載入中...</div>
    </header>

    <!-- 區塊 1: 利率指標 (同列排版) -->
    <div class="chart-card">
      <div class="chart-header">
        <h2 class="chart-title">聯準會利率 vs 美債殖利率 (2000-2026)</h2>
        <div class="embedded-metrics-row">
          <div class="metric-badge">
            <span class="metric-label">聯準會利率</span>
            <span class="metric-value" id="val-fed-rate" style="color: var(--accent-red);">- %</span>
          </div>
          <div class="metric-badge">
            <span class="metric-label">10年期美債</span>
            <span class="metric-value" id="val-us10y" style="color: var(--accent-blue);">- %</span>
          </div>
          <div class="metric-badge">
            <span class="metric-label">20年期美債</span>
            <span class="metric-value" id="val-us20y" style="color: var(--accent-yellow);">- %</span>
          </div>
        </div>
      </div>
      <div class="canvas-wrapper">
        <canvas id="ratesChart"></canvas>
      </div>
    </div>

    <!-- 區塊 2: 通膨與製造業指標 (同列排版 + 雙Y軸) -->
    <div class="chart-card">
      <div class="chart-header">
        <h2 class="chart-title">CPI 物價指數 vs 製造業 PMI 走勢 (2000-2026)</h2>
        <div class="embedded-metrics-row">
          <div class="metric-badge">
            <span class="metric-label">CPI 物價</span>
            <span class="metric-value" id="val-cpi" style="color: var(--accent-green);">-</span>
          </div>
          <div class="metric-badge">
            <span class="metric-label">核心 CPI</span>
            <span class="metric-value" id="val-core-cpi" style="color: var(--accent-purple);">-</span>
          </div>
          <div class="metric-badge">
            <span class="metric-label">PMI 指數</span>
            <span class="metric-value" id="val-pmi" style="color: var(--accent-blue);">-</span>
          </div>
        </div>
      </div>
      <div class="canvas-wrapper">
        <canvas id="cpiPmiChart"></canvas>
      </div>
    </div>

    <!-- 區塊 3: 外匯與原油價格 -->
    <div class="chart-card">
      <div class="chart-header">
        <h2 class="chart-title">美元 / 新台幣匯率 vs WTI 原油價格 (2000-2026)</h2>
        <div class="embedded-metrics-row-2">
          <div class="metric-badge">
            <span class="metric-label">美元 / 台幣</span>
            <span class="metric-value" id="val-usdtwd" style="color: var(--accent-orange);">-</span>
          </div>
          <div class="metric-badge">
            <span class="metric-label">WTI 原油</span>
            <span class="metric-value" id="val-oil" style="color: var(--accent-yellow);">- 美元</span>
          </div>
        </div>
      </div>
      <div class="canvas-wrapper">
        <canvas id="forexOilChart"></canvas>
      </div>
    </div>

    <!-- 即時新聞區域 -->
    <div class="news-section">
      <h2 style="margin-top:0; color:var(--accent-blue); font-size:1.1rem;">最新總經市場新聞焦點</h2>
      <div class="news-grid" id="news-list">載入新聞中...</div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const response = await fetch('data.json?t=' + new Date().getTime());
        const data = await response.json();

        document.getElementById('updated-at').innerText = '最後更新時間：' + data.updated_at;

        // 填入同列卡片數值
        document.getElementById('val-fed-rate').innerText = (data.latest_macro.fed_rate || '-') + ' %';
        document.getElementById('val-us10y').innerText = (data.latest_macro.us10y_yield || '-') + ' %';
        document.getElementById('val-us20y').innerText = (data.latest_macro.us20y_yield || '-') + ' %';
        document.getElementById('val-cpi').innerText = data.latest_macro.cpi || '-';
        document.getElementById('val-core-cpi').innerText = data.latest_macro.core_cpi || '-';
        document.getElementById('val-pmi').innerText = data.latest_macro.pmi || '-';
        document.getElementById('val-usdtwd').innerText = data.latest_macro.usdtwd || '-';
        document.getElementById('val-oil').innerText = (data.latest_macro.oil || '-') + ' $';

        // 1. 利率走勢圖
        new Chart(document.getElementById('ratesChart'), {
          type: 'line',
          data: {
            labels: data.history.fed_rate.dates,
            datasets: [
              { label: '聯準會利率 (%)', data: data.history.fed_rate.values, borderColor: '#f87171', backgroundColor: '#f87171', fill: false, pointRadius: 0, borderWidth: 2 },
              { label: '10年美債 (%)', data: data.history.us10y_yield.values, borderColor: '#38bdf8', backgroundColor: '#38bdf8', fill: false, pointRadius: 0, borderWidth: 2 },
              { label: '20年美債 (%)', data: data.history.us20y_yield.values, borderColor: '#fbbf24', backgroundColor: '#fbbf24', fill: false, pointRadius: 0, borderWidth: 2 }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
        });

        // 2. CPI 與 PMI 走勢圖 (啟用雙 Y 軸解析度)
        new Chart(document.getElementById('cpiPmiChart'), {
          type: 'line',
          data: {
            labels: data.history.cpi.dates,
            datasets: [
              { label: 'CPI 物價', data: data.history.cpi.values, borderColor: '#34d399', yAxisID: 'y', fill: false, pointRadius: 0, borderWidth: 2 },
              { label: '核心 CPI', data: data.history.core_cpi.values, borderColor: '#c084fc', yAxisID: 'y', fill: false, pointRadius: 0, borderWidth: 2 },
              { label: 'PMI 指數 (右軸)', data: data.history.pmi.values, borderColor: '#38bdf8', yAxisID: 'y1', fill: false, pointRadius: 0, borderWidth: 2, borderDash: [4, 4] }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc' } } },
            scales: {
              x: { ticks: { color: '#94a3b8' } },
              y: { type: 'linear', display: true, position: 'left', ticks: { color: '#34d399' }, title: { display: true, text: 'CPI 指數', color: '#34d399' } },
              y1: { type: 'linear', display: true, position: 'right', ticks: { color: '#38bdf8' }, grid: { drawOnChartArea: false }, title: { display: true, text: 'PMI 指數', color: '#38bdf8' } }
            }
          }
        });

        // 3. 美元/台幣與原油價格圖 (雙 Y 軸)
        new Chart(document.getElementById('forexOilChart'), {
          type: 'line',
          data: {
            labels: data.history.usdtwd.dates,
            datasets: [
              { label: '美元/台幣 (左軸)', data: data.history.usdtwd.values, borderColor: '#fb923c', yAxisID: 'y', fill: false, pointRadius: 0, borderWidth: 2 },
              { label: 'WTI 原油美元 (右軸)', data: data.history.oil.values, borderColor: '#fbbf24', yAxisID: 'y1', fill: false, pointRadius: 0, borderWidth: 2 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc' } } },
            scales: {
              x: { ticks: { color: '#94a3b8' } },
              y: { type: 'linear', display: true, position: 'left', ticks: { color: '#fb923c' }, title: { display: true, text: '匯率 (TWD)', color: '#fb923c' } },
              y1: { type: 'linear', display: true, position: 'right', ticks: { color: '#fbbf24' }, grid: { drawOnChartArea: false }, title: { display: true, text: '原油 (USD)', color: '#fbbf24' } }
            }
          }
        });

        // 渲染新聞
        const newsContainer = document.getElementById('news-list');
        newsContainer.innerHTML = data.news.map(item => `
          <div class="news-item">
            <a href="${item.link}" target="_blank">${item.title}</a>
            <div class="news-meta">${item.source} • ${item.published}</div>
          </div>
        `).join('');

      } catch (err) {
        document.getElementById('updated-at').innerText = '數據載入中，請執行 Actions 產生數據。';
      }
    }

    loadDashboard();
  </script>
</body>
</html>
