<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全球總經與關鍵指標儀表板 (2000-2026)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
    .update-time { text-align: center; color: #94a3b8; font-size: 0.9em; margin-bottom: 25px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .card { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
    .card h3 { margin: 0 0 10px 0; color: #cbd5e1; font-size: 1em; }
    .card .val { font-size: 1.6em; font-weight: bold; color: #f8fafc; }
    .chart-container { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 20px; margin-bottom: 25px; }
    .news-section { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .news-item { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #334155; }
    .news-item a { color: #38bdf8; text-decoration: none; font-weight: 500; }
    .news-item a:hover { text-decoration: underline; }
    .news-meta { font-size: 0.8em; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>全球總體經濟與利率儀表板</h1>
    <div class="update-time" id="updated-at">資料載入中...</div>

    <!-- 頂部數據卡片 -->
    <div class="grid">
      <div class="card"><h3>聯準會基準利率</h3><div class="val" id="fed-rate">- %</div></div>
      <div class="card"><h3>10年期美債殖利率</h3><div class="val" id="us10y">- %</div></div>
      <div class="card"><h3>20年期美債殖利率</h3><div class="val" id="us20y">- %</div></div>
      <div class="card"><h3>消費者物價指數 (CPI)</h3><div class="val" id="cpi">-</div></div>
      <div class="card"><h3>核心 CPI</h3><div class="val" id="core-cpi">-</div></div>
      <div class="card"><h3>製造業 PMI 指數</h3><div class="val" id="pmi">-</div></div>
    </div>

    <!-- 2000-2026 走勢圖表區塊 -->
    <div class="chart-container">
      <h2>聯準會利率 vs 10年/20年期美債殖利率走勢 (2000 - 2026)</h2>
      <canvas id="ratesChart"></canvas>
    </div>

    <div class="chart-container">
      <h2>美國 CPI 與核心 CPI 物價指數走勢 (2000 - 2026)</h2>
      <canvas id="cpiChart"></canvas>
    </div>

    <!-- 即時新聞 -->
    <div class="news-section">
      <h2>最新總經與市場新聞</h2>
      <div id="news-list">載入新聞中...</div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const response = await fetch('data.json?t=' + new Date().getTime());
        const data = await response.json();

        document.getElementById('updated-at').innerText = '最後更新時間：' + data.updated_at;

        // 填入最新數值
        document.getElementById('fed-rate').innerText = (data.latest_macro.fed_rate || '-') + ' %';
        document.getElementById('us10y').innerText = (data.latest_macro.us10y_yield || '-') + ' %';
        document.getElementById('us20y').innerText = (data.latest_macro.us20y_yield || '-') + ' %';
        document.getElementById('cpi').innerText = data.latest_macro.cpi || '-';
        document.getElementById('core-cpi').innerText = data.latest_macro.core_cpi || '-';
        document.getElementById('pmi').innerText = data.latest_macro.pmi || '-';

        // 渲染圖表 1: 利率與美債走勢
        new Chart(document.getElementById('ratesChart'), {
          type: 'line',
          data: {
            labels: data.history.fed_rate.dates,
            datasets: [
              { label: '聯準會利率 (%)', data: data.history.fed_rate.values, borderColor: '#ef4444', fill: false, pointRadius: 0 },
              { label: '10年美債殖利率 (%)', data: data.history.us10y_yield.values, borderColor: '#38bdf8', fill: false, pointRadius: 0 },
              { label: '20年美債殖利率 (%)', data: data.history.us20y_yield.values, borderColor: '#f59e0b', fill: false, pointRadius: 0 }
            ]
          },
          options: { responsive: true, plugins: { legend: { labels: { color: '#f8fafc' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
        });

        // 渲染圖表 2: CPI 走勢
        new Chart(document.getElementById('cpiChart'), {
          type: 'line',
          data: {
            labels: data.history.cpi.dates,
            datasets: [
              { label: 'CPI 物價指數', data: data.history.cpi.values, borderColor: '#10b981', fill: false, pointRadius: 0 },
              { label: '核心 CPI', data: data.history.core_cpi.values, borderColor: '#a855f7', fill: false, pointRadius: 0 }
            ]
          },
          options: { responsive: true, plugins: { legend: { labels: { color: '#f8fafc' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
        });

        // 渲染新聞
        const newsContainer = document.getElementById('news-list');
        newsContainer.innerHTML = data.news.map(item => `
          <div class="news-item">
            <a href="${item.link}" target="_blank">${item.title}</a>
            <div class="news-meta">${item.source} • ${item.published}</div>
          </div>
        `).join('');

      } catch (err) {
        document.getElementById('updated-at').innerText = '讀取失敗，請確認手動執行 Actions 產生最新數據。';
      }
    }

    loadDashboard();
  </script>
</body>
</html>
