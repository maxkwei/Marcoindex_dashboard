<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全球總經與利率整合儀表板 (2000-2026)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-red: #f87171;
      --accent-yellow: #fbbf24;
      --accent-green: #34d399;
      --accent-purple: #c084fc;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      margin: 0;
      color: var(--accent-blue);
      font-size: 1.5rem;
    }

    .update-time {
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    /* 圖表與卡片整合區域 Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    @media (max-width: 680px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 整合型圖表卡片外殼 */
    .chart-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chart-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin: 0;
    }

    /* 嵌入式數據數值卡片區 */
    .embedded-metrics {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .metric-badge {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 12px;
      text-align: right;
      min-width: 90px;
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      display: block;
    }

    .metric-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .canvas-wrapper {
      position: relative;
      flex-grow: 1;
      min-height: 300px;
    }

    /* 新聞區塊 */
    .news-section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .news-section h2 {
      margin-top: 0;
      font-size: 1.1rem;
      color: var(--accent-blue);
      margin-bottom: 15px;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
    }

    .news-item {
      background: rgba(15, 23, 42, 0.4);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .news-item a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      display: block;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .news-item a:hover {
      color: var(--accent-blue);
    }

    .news-meta {
      font-size: 0.75rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>全球總體經濟與利率整合儀表板</h1>
      <div class="update-time" id="updated-at">資料載入中...</div>
    </header>

    <!-- 主數據圖表區：圖表與數值卡片併排整合 -->
    <div class="dashboard-grid">
      
      <!-- 整合區塊 1: 利率與美債殖利率 -->
      <div class="chart-card">
        <div class="chart-header">
          <h2 class="chart-title">聯準會利率 vs 美債殖利率 (2000-2026)</h2>
          <div class="embedded-metrics">
            <div class="metric-badge">
              <span class="metric-label">聯準會利率</span>
              <span class="metric-value" id="val-fed-rate" style="color: var(--accent-red);">- %</span>
            </div>
            <div class="metric-badge">
              <span class="metric-label">10年期美債</span>
              <span class="metric-value" id="val-us10y" style="color: var(--accent-blue);">- %</span>
            </div>
            <div class="metric-badge">
              <span class="metric-label">20年期美債</span>
              <span class="metric-value" id="val-us20y" style="color: var(--accent-yellow);">- %</span>
            </div>
          </div>
        </div>
        <div class="canvas-wrapper">
          <canvas id="ratesChart"></canvas>
        </div>
      </div>

      <!-- 整合區塊 2: 通膨與經濟指標 (CPI / PMI) -->
      <div class="chart-card">
        <div class="chart-header">
          <h2 class="chart-title">CPI 物價指數與製造業 PMI 走勢 (2000-2026)</h2>
          <div class="embedded-metrics">
            <div class="metric-badge">
              <span class="metric-label">CPI 物價</span>
              <span class="metric-value" id="val-cpi" style="color: var(--accent-green);">-</span>
            </div>
            <div class="metric-badge">
              <span class="metric-label">核心 CPI</span>
              <span class="metric-value" id="val-core-cpi" style="color: var(--accent-purple);">-</span>
            </div>
            <div class="metric-badge">
              <span class="metric-label">PMI 指數</span>
              <span class="metric-value" id="val-pmi" style="color: var(--accent-blue);">-</span>
            </div>
          </div>
        </div>
        <div class="canvas-wrapper">
          <canvas id="cpiChart"></canvas>
        </div>
      </div>

    </div>

    <!-- 即時新聞區域 -->
    <div class="news-section">
      <h2>最新總經市場新聞焦點</h2>
      <div class="news-grid" id="news-list">載入新聞中...</div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const response = await fetch('data.json?t=' + new Date().getTime());
        const data = await response.json();

        document.getElementById('updated-at').innerText = '最後更新時間：' + data.updated_at;

        // 填入整合至圖表標頭的最新數值
        document.getElementById('val-fed-rate').innerText = (data.latest_macro.fed_rate || '-') + ' %';
        document.getElementById('val-us10y').innerText = (data.latest_macro.us10y_yield || '-') + ' %';
        document.getElementById('val-us20y').innerText = (data.latest_macro.us20y_yield || '-') + ' %';
        document.getElementById('val-cpi').innerText = data.latest_macro.cpi || '-';
        document.getElementById('val-core-cpi').innerText = data.latest_macro.core_cpi || '-';
        document.getElementById('val-pmi').innerText = data.latest_macro.pmi || '-';

        // 1. 渲染整合圖表：利率與美債走勢
        new Chart(document.getElementById('ratesChart'), {
          type: 'line',
          data: {
            labels: data.history.fed_rate.dates,
            datasets: [
              { label: '聯準會利率 (%)', data: data.history.fed_rate.values, borderColor: '#f87171', backgroundColor: '#f87171', fill: false, pointRadius: 0, borderWidth: 2 },
              { label: '10年美債 (%)', data: data.history.us10y_yield.values, borderColor: '#38bdf8', backgroundColor: '#38bdf8', fill: false, pointRadius: 0, borderWidth: 2 },
              { label: '20年美債 (%)', data: data.history.us20y_yield.values, borderColor: '#fbbf24', backgroundColor: '#fbbf24', fill: false, pointRadius: 0, borderWidth: 2 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc', font: { size: 11 } } } },
            scales: { x: { ticks: { color: '#94a3b8', maxRotation: 0 } }, y: { ticks: { color: '#94a3b8' } } }
          }
        });

        // 2. 渲染整合圖表：CPI 與 PMI 走勢
        new Chart(document.getElementById('cpiChart'), {
          type: 'line',
          data: {
            labels: data.history.cpi.dates,
            datasets: [
              { label: 'CPI 物價指數', data: data.history.cpi.values, borderColor: '#34d399', backgroundColor: '#34d399', fill: false, pointRadius: 0, borderWidth: 2 },
              { label: '核心 CPI', data: data.history.core_cpi.values, borderColor: '#c084fc', backgroundColor: '#c084fc', fill: false, pointRadius: 0, borderWidth: 2 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc', font: { size: 11 } } } },
            scales: { x: { ticks: { color: '#94a3b8', maxRotation: 0 } }, y: { ticks: { color: '#94a3b8' } } }
          }
        });

        // 3. 渲染新聞網格
        const newsContainer = document.getElementById('news-list');
        newsContainer.innerHTML = data.news.map(item => `
          <div class="news-item">
            <a href="${item.link}" target="_blank">${item.title}</a>
            <div class="news-meta">${item.source} • ${item.published}</div>
          </div>
        `).join('');

      } catch (err) {
        document.getElementById('updated-at').innerText = '數據讀取失敗，請確認 data.json 是否已成功生成。';
      }
    }

    loadDashboard();
  </script>
</body>
</html>
